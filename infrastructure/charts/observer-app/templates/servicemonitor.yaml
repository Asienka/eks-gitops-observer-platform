apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-servicemonitor
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}  
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      app: {{ .Chart.Name }} 
  endpoints:
  - port: http
    path: /metrics
    interval: 15s