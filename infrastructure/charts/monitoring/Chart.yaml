apiVersion: v2
name: monitoring
description: A Helm chart for monitoring stack including Prometheus and Grafana
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: kube-prometheus-stack
    version: 69.2.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki-stack
    version: 2.8.0
    repository: https://grafana.github.io/helm-charts
  - name: jaeger
    version: 4.12.0
    repository: https://jaegertracing.github.io/helm-charts