kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      retention: 2d
      resources:
        requests:
          memory: 400Mi
          cpu: 200m
        limits:
          memory: 1Gi
          cpu: 500m

  grafana:
    enabled: true
    
    persistence:
      enabled: false

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL

    service:
      type: NodePort
      nodePort: 32000

    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://monitoring-loki.monitoring.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
      
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://monitoring-jaeger-query.monitoring.svc.cluster.local:16686
        jsonData:
          tracesToLogs:
            datasourceUid: Loki

  alertmanager:
    enabled: false 
  nodeExporter:
    enabled: true 
  
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: filesystem
    bucketNames:
      chunks: ""
      ruler: ""
      admin: ""
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules

  ruler:
    enable_api: true
    storage:
      type: local
      local:
        directory: /tmp/loki/rules

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
    limits:
      memory: 500Mi
      cpu: 200m

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0

promtail:
  enabled: true
  config:
    clients:
      - url: http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  resources:
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 200Mi
      cpu: 100m
  
jaeger:
  allInOne:
    enabled: true
    resources:
      requests:
        memory: 200Mi
        cpu: 100m
      limits:
        memory: 500Mi
        cpu: 200m
  storage:
    type: memory