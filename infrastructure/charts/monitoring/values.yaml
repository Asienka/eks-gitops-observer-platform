kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

      retention: 2d
      resources:
        requests:
          memory: 400Mi
          cpu: 200m
        limits:
          memory: 1Gi
          cpu: 500m

  grafana:
    enabled: true
    
    persistence:
      enabled: false

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL

    service:
      type: NodePort
      nodePort: 32000

    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://monitoring-loki-stack.monitoring.svc.cluster.local:3100
        jsonData:
          maxLines: 1000
      
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://monitoring-jaeger-collector.monitoring.svc.cluster.local:16686
        jsonData:
          tracesToLogs:
            datasourceUid: Loki

  alertmanager:
    enabled: false 
  nodeExporter:
    enabled: true 
  
loki-stack:
  loki:
    enabled: true
    persistence:
      enabled: false
    resources:
      requests:
        memory: 200Mi
        cpu: 100m
      limits:
        memory: 500Mi
        cpu: 200m

  promtail:
    enabled: true
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 200Mi
        cpu: 100m
  
  
  jaeger:
    enabled: true
    persistence:
      enabled: false
    resources:
      requests:
        memory: 200Mi
        cpu: 100m
      limits:
        memory: 500Mi
        cpu: 200m